[server]
# Serve a pasta static/ em /app/static/. Necessário para o localize.html,
# que st.iframe carrega para traduzir os textos internos dos widgets.
enableStaticServing = true

[theme]
base = "dark"

# Vermelho da marca UM PASSO MAIS ESCURO, e só nos widgets. O #ea1d2c do logo
# dá 4,46:1 com texto branco — reprova o AA de texto por 0,04. Este dá 5,87:1
# com branco e ainda 3,22:1 contra a superfície, então o botão continua lendo
# como forma cheia. As marcas de dado seguem no #ea1d2c puro (dashboard.py),
# onde o limiar é de objeto gráfico, 3:1, e o vermelho do logo passa.
primaryColor = "#c9101d"

# NÃO mudar sem revalidar a paleta dos gráficos: foi contra esta superfície
# que as três matizes passaram nos testes de CVD e contraste.
backgroundColor = "#0e1117"

secondaryBackgroundColor = "#161b24"
textColor = "#e6e8ec"
borderColor = "#242a35"
linkColor = "#5b9df0"

baseRadius = "0.5rem"
buttonRadius = "0.5rem"
showWidgetBorder = true
showSidebarBorder = true

# Mesma paleta validada dos gráficos, para qualquer série que não receba
# cor explícita no código.
chartCategoricalColors = ["#ea1d2c", "#3987e5", "#199e70"]

# O valor do KPI é o que se lê primeiro na varredura — ganha peso.
metricValueFontWeight = 700

[theme.sidebar]
# Um passo mais escura que o conteúdo: separa por superfície, sem precisar
# de borda grossa nem caixa em volta de cada filtro.
backgroundColor = "#0b0e14"
borderColor = "#1e242e"
